version: "3.9"

# Full stack for EasyPanel / VPS deployment. Local development typically
# only needs infrastructure/docker/docker-compose.dev.yml (postgres+redis)
# with the apps run via `npm run dev:*` for hot reload.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-printer_saas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-printer_saas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printer_saas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-printer_saas}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-printer_saas}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?}
      CORS_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}
      API_PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      # Only stateful thing on this service — service order photos (spec
      # §"Ordens de Serviço", fotos antes/depois). Everything else stays
      # stateless in Postgres/Redis; see docs/easypanel.md for the EasyPanel
      # equivalent of this mount.
      - api_uploads:/repo/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-printer_saas}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-printer_saas}?schema=public
      REDIS_URL: redis://redis:6379
      AGENT_OFFLINE_THRESHOLD_SECONDS: ${AGENT_OFFLINE_THRESHOLD_SECONDS:-120}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  api_uploads:
